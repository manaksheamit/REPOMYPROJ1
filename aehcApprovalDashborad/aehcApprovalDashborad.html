<template>

    <lightning-card>
         <div slot="title" class="slds-text-heading_large slds-text-title_bold">
            My Approval Work Items
         </div>
    
        <template if:true={hasOptions}>
            <div class="slds-p-around_medium">

                <lightning-combobox label="Request Type" value={selectedType} options={requestTypeOptions}
                    onchange={handleTypeChange}>
                </lightning-combobox>

            </div>

            <lightning-tabset active-tab-value={selectedStatus}>

                <lightning-tab label="Pending" value="Pending" onactive={handlePending}>
                </lightning-tab>

                <lightning-tab label="Approved" value="Approved" onactive={handleApproved}>
                </lightning-tab>

                <lightning-tab label="Rejected" value="Rejected" onactive={handleRejected}>
                </lightning-tab>

            </lightning-tabset>

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading">
                </lightning-spinner>
            </template>

            <template if:false={isLoading}>
                <template if:true={hasData}>
                    <div class="table-container">
                        <lightning-datatable key-field="id" data={tableData} columns={columns} hide-checkbox-column>
                        </lightning-datatable>
                    </div>
                </template>


                <template if:false={hasData}>
                    <div class="slds-p-around_large slds-align_absolute-center">
                        <div class="slds-text-align_center">
                            <p class="slds-text-heading_small">
                                No records found
                            </p>
                        </div>
                    </div>
                </template>


            </template>
        </template>
        <template if:false={hasOptions}>
            <div class="slds-text-color_weak slds-m-around_medium">
                No approval actions are available for your account.
            </div>
        </template>

    </lightning-card>

</template>
