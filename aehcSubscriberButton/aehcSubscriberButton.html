<template>

    <template if:true={showButton}>
        <lightning-button
            label="Subscribers"
            variant="brand"
            onclick={openSubscriberModal}>
        </lightning-button>
    </template>

    <!-- Modal -->
    <template if:true={isSubscriberModal}>
         <section role="dialog" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" alternative-text="close"
                        onclick={closeSubscriberModal} class="slds-modal__close">
                    </lightning-button-icon>

                    <h2 class="slds-text-heading_medium">Subscribers</h2>
                </header>

                <!-- Body -->
                <div class="slds-modal__content slds-p-around_medium">

                    <c-aehc-subscribers-lwc
                        record-id={assetRecordId} >
                    </c-aehc-subscribers-lwc>

                </div>

                  <!-- Footer -->
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={closeSubscriberModal}>
                    </lightning-button>
                </footer>

            </div>
        </section>

        <!-- Backdrop -->
        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

</template>
