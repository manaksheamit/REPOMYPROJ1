<template>
    <lightning-card title="Subscribers">

        <!-- Search -->
        <div class="slds-p-around_medium">
            <lightning-input
                type="search"
                placeholder="Search by App name / Environment"
                onchange={handleSearch}>
            </lightning-input>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                <thead>
                    <tr>
                        <th>Application Name</th>
                        <th>Created Date</th>
                        <th>Created By</th>
                        <th>Environment</th>
                        <th>Approver</th>
                        <th>Approved Date</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={data} for:item="row">
                        <tr key={row.createdDate}>
                            <td>{row.application}</td>
                            <td>{row.createdDate}</td>
                            <td>{row.createdBy}</td>
                            <td>{row.environment}</td>
                            <td>{row.approver}</td>
                            <td>{row.approvedDate}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- Load More -->
         <template if:true={viewLoadMore}>
        <div class="slds-align_absolute-center slds-p-around_medium">
            <lightning-button label="Load More" onclick={handleLoadMore}></lightning-button>
        </div>
        </template>
    </lightning-card>
</template>
